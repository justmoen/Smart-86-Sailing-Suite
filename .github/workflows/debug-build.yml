name: Build ESP32-P4 Arduino SSL Managed Component

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32p4
          command: |
            set -e

            echo "============================================================"
            echo "CLEAN MANAGED COMPONENT BUILD"
            echo "============================================================"

            echo ""
            echo "Removing local Arduino component override..."

            rm -rf components/arduino-esp32

            echo ""
            echo "Arduino component configuration:"
            echo "--------------------------------"

            if [ -f components/idf_component.yml ]; then
              cat components/idf_component.yml
            fi

            echo ""
            echo "============================================================"
            echo "ESP-IDF"
            echo "============================================================"

            idf.py --version

            echo ""
            echo "============================================================"
            echo "SET TARGET"
            echo "============================================================"

            idf.py set-target esp32p4

            echo ""
            echo "============================================================"
            echo "ENABLE MBEDTLS PSK"
            echo "============================================================"

            echo "Adding CONFIG_MBEDTLS_KEY_EXCHANGE_PSK=y"

            if grep -q "^CONFIG_MBEDTLS_KEY_EXCHANGE_PSK=" sdkconfig; then
              sed -i \
                "s/^CONFIG_MBEDTLS_KEY_EXCHANGE_PSK=.*/CONFIG_MBEDTLS_KEY_EXCHANGE_PSK=y/" \
                sdkconfig
            else
              sed -i \
                "/^CONFIG_MBEDTLS_PSK_MODES=/a CONFIG_MBEDTLS_KEY_EXCHANGE_PSK=y" \
                sdkconfig
            fi

            echo ""
            echo "PSK configuration:"
            grep -n "CONFIG_MBEDTLS_PSK_MODES" sdkconfig || true
            grep -n "CONFIG_MBEDTLS_KEY_EXCHANGE_PSK" sdkconfig || true
            grep -n "CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_PSK" sdkconfig || true
            grep -n "CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_PSK" sdkconfig || true

            echo ""
            echo "============================================================"
            echo "RECONFIGURE"
            echo "============================================================"

            idf.py reconfigure

            echo ""
            echo "============================================================"
            echo "VERIFY CONFIGURATION"
            echo "============================================================"

            grep -n "CONFIG_MBEDTLS_PSK_MODES" sdkconfig || true
            grep -n "CONFIG_MBEDTLS_KEY_EXCHANGE_PSK" sdkconfig || true
            grep -n "CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_PSK" sdkconfig || true
            grep -n "CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_PSK" sdkconfig || true

            echo ""
            echo "============================================================"
            echo "VERIFY MANAGED ARDUINO COMPONENT"
            echo "============================================================"

            if [ -d managed_components/espressif__arduino-esp32 ]; then
              echo "Managed Arduino component FOUND"
              grep -n "version:" \
                managed_components/espressif__arduino-esp32/idf_component.yml \
                || true
            else
              echo "ERROR: Managed Arduino component NOT FOUND"
              exit 1
            fi

            echo ""
            echo "============================================================"
            echo "CLEAN BUILD"
            echo "============================================================"

            rm -rf build

            idf.py build

            echo ""
            echo "============================================================"
            echo "BUILD SUCCESS"
            echo "============================================================"