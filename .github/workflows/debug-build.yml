name: Debug ESP32-P4 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Debug ESP32-P4 build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32p4
          command: |
            rm -f sdkconfig
            idf.py set-target esp32p4

                echo "=== ARDUINO CMAKE SSL REFERENCES ==="
                grep -R -n "NetworkClientSecure\|ssl_client.cpp\|ssl_client" managed_components/espressif__arduino-esp32 --include="CMakeLists.txt" --include="*.cmake" 2>/dev/null || true

                echo "=== CI KCONFIG SSL ==="
                grep -E "CONFIG_MBEDTLS|CONFIG_ESP_TLS" sdkconfig | head -50 || true

                echo "=== BUILD ==="
                idf.py build