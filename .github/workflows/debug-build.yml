name: Debug ESP32-P4 Arduino SSL PSK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-ssl:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Diagnose Arduino SSL PSK
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32p4
          command: |
            set -o pipefail

            echo "============================================================"
            echo "ESP-IDF VERSION"
            echo "============================================================"

            idf.py --version

            echo ""
            echo "============================================================"
            echo "PSK CONFIGURATION"
            echo "============================================================"

            idf.py set-target esp32p4
            idf.py reconfigure

            echo "--- sdkconfig ---"

            grep -n -E \
              '^CONFIG_(MBEDTLS_PSK_MODES|MBEDTLS_KEY_EXCHANGE_.*PSK)' \
              sdkconfig \
              || true

            echo ""
            echo "--- generated sdkconfig.h ---"

            grep -n -E \
              'MBEDTLS_KEY_EXCHANGE(_SOME|__SOME|_PSK).*PSK_ENABLED' \
              build/config/sdkconfig.h \
              || true

            echo ""
            echo "============================================================"
            echo "ARDUINO SSL CONDITION"
            echo "============================================================"

            sed -n '24,35p' \
              components/arduino-esp32/libraries/NetworkClientSecure/src/ssl_client.cpp

            echo ""
            echo "============================================================"
            echo "NINJA SSL COMPILER COMMAND"
            echo "============================================================"

            ninja -C build -t commands \
              | grep "ssl_client.cpp" \
              | head -1 \
              || true

            echo ""
            echo "============================================================"
            echo "END"
            echo "============================================================"