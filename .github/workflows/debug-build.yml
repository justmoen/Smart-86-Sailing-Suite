name: Debug ESP32-P4 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Debug ESP32-P4 build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32p4
          command: |
            idf.py set-target esp32p4

            sed -i '/set(ARDUINO_LIBRARY_NetworkClientSecure_SRCS)/i set_source_files_properties("${CMAKE_CURRENT_SOURCE_DIR}/libraries/NetworkClientSecure/src/ssl_client.cpp" PROPERTIES LANGUAGE CXX)' managed_components/espressif__arduino-esp32/CMakeLists.txt

            idf.py reconfigure
            idf.py build

