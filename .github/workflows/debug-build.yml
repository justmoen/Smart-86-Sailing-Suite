name: Debug ESP32-P4 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Debug ESP32-P4 build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32p4
          command: |
            rm -f sdkconfig
            idf.py set-target esp32p4

            echo "=== CI ARDUINO SSL SYMBOLS ==="
            nm -C managed_components/espressif__arduino-esp32/libespressif__arduino-esp32.a | grep -E 'stop_ssl_socket|start_ssl_client|ssl_init' || true

            echo "=== CI SSL OBJECT ==="
            find managed_components/espressif__arduino-esp32 -name 'ssl_client.cpp.obj' -print

            echo "=== CI COMPONENT TREE ==="
            find managed_components/espressif__arduino-esp32/libraries/NetworkClientSecure -maxdepth 2 -type f | sort

            echo "========== Build =========="
            idf.py build