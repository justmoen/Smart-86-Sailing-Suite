name: Debug ESP32-P4 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Debug ESP32-P4 build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32p4
          command: |
            rm -f sdkconfig
            idf.py set-target esp32p4

            echo "=== NINJA SSL RULE ==="
            grep -n -A5 -B5 "ssl_client.cpp.obj" build/esp-idf/espressif__arduino-esp32/build.ninja 2>/dev/null || true

            echo "=== ARDUINO OBJECTS ==="
            find build/esp-idf/espressif__arduino-esp32 -type f -name "*.obj" | grep -E "NetworkClientSecure|ssl_client" || true
