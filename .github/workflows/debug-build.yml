name: Verify ESP32-P4 Arduino SSL PSK Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ssl-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify Arduino SSL PSK configuration
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32p4
          command: |
            set -e

            echo "============================================================"
            echo "CREATE TEST CONFIGURATION"
            echo "============================================================"

            cat >> sdkconfig.defaults <<'EOF'
            CONFIG_MBEDTLS_PSK_MODES=y
            CONFIG_MBEDTLS_KEY_EXCHANGE_PSK=y
            EOF

            echo "--- sdkconfig.defaults ---"
            tail -20 sdkconfig.defaults

            echo "============================================================"
            echo "CONFIGURE"
            echo "============================================================"

            idf.py set-target esp32p4
            idf.py reconfigure

            echo "============================================================"
            echo "VERIFY KCONFIG"
            echo "============================================================"

            echo "--- sdkconfig ---"
            grep -E \
              "CONFIG_MBEDTLS_(PSK_MODES|KEY_EXCHANGE_PSK)=" \
              sdkconfig

            echo "--- generated sdkconfig.h ---"
            grep -E \
              "MBEDTLS_(KEY_EXCHANGE_PSK|PSK)" \
              build/config/sdkconfig.h \
              || true

            echo "============================================================"
            echo "VERIFY ESP-IDF GENERATED MBEDTLS MACROS"
            echo "============================================================"

            echo "--- esp_config.h PSK definitions ---"
            grep -n -A20 -B5 \
              "MBEDTLS_KEY_EXCHANGE_PSK_ENABLED" \
              "$IDF_PATH/components/mbedtls/port/include/mbedtls/esp_config.h" \
              || true

            echo "============================================================"
            echo "SSL SOURCE CONDITION"
            echo "============================================================"

            echo "--- ssl_client.cpp condition ---"
            sed -n '24,35p' \
              components/arduino-esp32/libraries/NetworkClientSecure/src/ssl_client.cpp

            echo "============================================================"
            echo "BUILD SSL OBJECT"
            echo "============================================================"

            ninja -C build -v \
              esp-idf/arduino-esp32/CMakeFiles/__idf_arduino-esp32.dir/libraries/NetworkClientSecure/src/ssl_client.cpp.obj

            echo "============================================================"
            echo "SSL OBJECT SYMBOLS"
            echo "============================================================"

            SSL_OBJECT="build/esp-idf/arduino-esp32/CMakeFiles/__idf_arduino-esp32.dir/libraries/NetworkClientSecure/src/ssl_client.cpp.obj"

            echo "--- stop_ssl_socket ---"
            nm -C "$SSL_OBJECT" \
              | grep stop_ssl_socket

            echo "--- start_ssl_client ---"
            nm -C "$SSL_OBJECT" \
              | grep start_ssl_client

            echo "--- send_ssl_data ---"
            nm -C "$SSL_OBJECT" \
              | grep send_ssl_data

            echo "--- ssl_init ---"
            nm -C "$SSL_OBJECT" \
              | grep " ssl_init"

            echo "--- attach_ssl_certificate_bundle ---"
            nm -C "$SSL_OBJECT" \
              | grep attach_ssl_certificate_bundle

            echo "============================================================"
            echo "BUILD ARDUINO ARCHIVE"
            echo "============================================================"

            ninja -C build -v \
              esp-idf/arduino-esp32/libarduino-esp32.a

            echo "============================================================"
            echo "ARCHIVE SSL SYMBOLS"
            echo "============================================================"

            ARDUINO_ARCHIVE="build/esp-idf/arduino-esp32/libarduino-esp32.a"

            echo "--- stop_ssl_socket ---"
            nm -C "$ARDUINO_ARCHIVE" \
              | grep stop_ssl_socket

            echo "--- start_ssl_client ---"
            nm -C "$ARDUINO_ARCHIVE" \
              | grep start_ssl_client

            echo "--- send_ssl_data ---"
            nm -C "$ARDUINO_ARCHIVE" \
              | grep send_ssl_data

            echo "--- ssl_init ---"
            nm -C "$ARDUINO_ARCHIVE" \
              | grep " ssl_init"

            echo "============================================================"
            echo "FULL APPLICATION BUILD"
            echo "============================================================"

            idf.py build

            echo "============================================================"
            echo "SUCCESS"
            echo "============================================================"

            echo "The Arduino SSL implementation is now being compiled."
            echo "The required PSK symbols are present."
            echo "The ESP32-P4 application links successfully."