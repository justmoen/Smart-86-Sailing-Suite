name: Debug ESP32-P4 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Debug ESP32-P4 build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32p4
          command: |
            rm -f sdkconfig
            idf.py set-target esp32p4

            echo "=== ARDUINO VERSION ==="
            cat managed_components/espressif__arduino-esp32/idf_component.yml

            echo "=== LOCKFILE ARDUINO ==="
            grep -A20 "espressif/arduino-esp32:" dependencies.lock

            echo "=== SSL OBJECT ==="
            find managed_components/espressif__arduino-esp32 -name "ssl_client.cpp.obj" -print

            echo "=== BUILD ==="
            idf.py build