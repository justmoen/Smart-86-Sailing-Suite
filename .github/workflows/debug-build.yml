name: Debug ESP32-P4 Arduino SSL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Debug Arduino SSL compile
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32p4
          command: |
            set -o pipefail

            echo "============================================================"
            echo "CONFIGURE"
            echo "============================================================"

            idf.py set-target esp32p4
            idf.py reconfigure

            echo "============================================================"
            echo "MBEDTLS PSK CONFIGURATION"
            echo "============================================================"

            echo "--- sdkconfig PSK settings ---"
            grep -i psk sdkconfig || true

            echo "--- generated sdkconfig.h PSK settings ---"
            grep -i psk build/config/sdkconfig.h || true

            echo "--- all MBEDTLS settings ---"
            grep CONFIG_MBEDTLS sdkconfig || true

            echo "============================================================"
            echo "SSL CLIENT SOURCE CONDITIONS"
            echo "============================================================"

            echo "--- PSK warning ---"
            grep -n -B10 -A15 "Please call" \
              components/arduino-esp32/libraries/NetworkClientSecure/src/ssl_client.cpp || true

            echo "--- stop_ssl_socket ---"
            grep -n "stop_ssl_socket" \
              components/arduino-esp32/libraries/NetworkClientSecure/src/ssl_client.cpp || true

            echo "--- start_ssl_client ---"
            grep -n "start_ssl_client" \
              components/arduino-esp32/libraries/NetworkClientSecure/src/ssl_client.cpp || true

            echo "--- send_ssl_data ---"
            grep -n "send_ssl_data" \
              components/arduino-esp32/libraries/NetworkClientSecure/src/ssl_client.cpp || true

            echo "============================================================"
            echo "SSL NINJA RULE"
            echo "============================================================"

            grep -n -A8 -B2 "ssl_client.cpp.obj" build/build.ninja || true

            echo "============================================================"
            echo "NINJA QUERY"
            echo "============================================================"

            ninja -C build -t query \
              esp-idf/arduino-esp32/CMakeFiles/__idf_arduino-esp32.dir/libraries/NetworkClientSecure/src/ssl_client.cpp.obj \
              || true

            echo "============================================================"
            echo "NINJA TARGETS"
            echo "============================================================"

            ninja -C build -t targets all | grep arduino-esp32 || true

            echo "============================================================"
            echo "TRY BUILDING SSL OBJECT DIRECTLY"
            echo "============================================================"

            ninja -C build -v \
              esp-idf/arduino-esp32/CMakeFiles/__idf_arduino-esp32.dir/libraries/NetworkClientSecure/src/ssl_client.cpp.obj

            echo "============================================================"
            echo "OBJECT AFTER DIRECT BUILD"
            echo "============================================================"

            ls -lh \
              build/esp-idf/arduino-esp32/CMakeFiles/__idf_arduino-esp32.dir/libraries/NetworkClientSecure/src/ssl_client.cpp.obj \
              2>/dev/null || true

            echo "============================================================"
            echo "OBJECT SYMBOLS"
            echo "============================================================"

            echo "--- All SSL-related symbols ---"
            nm -C \
              build/esp-idf/arduino-esp32/CMakeFiles/__idf_arduino-esp32.dir/libraries/NetworkClientSecure/src/ssl_client.cpp.obj \
              2>/dev/null | grep -i ssl || true

            echo "--- stop_ssl_socket ---"
            nm -C \
              build/esp-idf/arduino-esp32/CMakeFiles/__idf_arduino-esp32.dir/libraries/NetworkClientSecure/src/ssl_client.cpp.obj \
              2>/dev/null | grep stop_ssl_socket || true

            echo "--- start_ssl_client ---"
            nm -C \
              build/esp-idf/arduino-esp32/CMakeFiles/__idf_arduino-esp32.dir/libraries/NetworkClientSecure/src/ssl_client.cpp.obj \
              2>/dev/null | grep start_ssl_client || true

            echo "--- send_ssl_data ---"
            nm -C \
              build/esp-idf/arduino-esp32/CMakeFiles/__idf_arduino-esp32.dir/libraries/NetworkClientSecure/src/ssl_client.cpp.obj \
              2>/dev/null | grep send_ssl_data || true

            echo "============================================================"
            echo "BUILD ARDUINO ARCHIVE"
            echo "============================================================"

            ninja -C build -v \
              esp-idf/arduino-esp32/libarduino-esp32.a

            echo "============================================================"
            echo "ARCHIVE"
            echo "============================================================"

            ls -lh build/esp-idf/arduino-esp32/libarduino-esp32.a

            echo "============================================================"
            echo "ARCHIVE SSL MEMBERS"
            echo "============================================================"

            ar t build/esp-idf/arduino-esp32/libarduino-esp32.a \
              | grep ssl_client || true

            echo "============================================================"
            echo "ARCHIVE SSL SYMBOLS"
            echo "============================================================"

            echo "--- stop_ssl_socket ---"
            nm -C build/esp-idf/arduino-esp32/libarduino-esp32.a \
              | grep stop_ssl_socket || true

            echo "--- start_ssl_client ---"
            nm -C build/esp-idf/arduino-esp32/libarduino-esp32.a \
              | grep start_ssl_client || true

            echo "--- send_ssl_data ---"
            nm -C build/esp-idf/arduino-esp32/libarduino-esp32.a \
              | grep send_ssl_data || true

            echo "--- ssl_init ---"
            nm -C build/esp-idf/arduino-esp32/libarduino-esp32.a \
              | grep ssl_init || true

            echo "============================================================"
            echo "FINAL INTERPRETATION"
            echo "============================================================"

            echo "If ssl_client.cpp contains the functions but the object"
            echo "does not define them, conditional compilation is excluding"
            echo "the implementations."
            echo ""
            echo "The compiler warning about PSK configuration strongly"
            echo "suggests an mbedTLS Kconfig dependency."
            echo ""
            echo "The next step will be to identify the exact CONFIG_MBEDTLS"
            echo "option required by Arduino-ESP32 3.3.11."

            echo "============================================================"
            echo "DONE"
            echo "============================================================"