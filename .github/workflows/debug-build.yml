name: Debug ESP32-P4 Arduino SSL Kconfig

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-kconfig:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Debug mbedTLS PSK Kconfig
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32p4
          command: |
            set -o pipefail

            echo "============================================================"
            echo "PROJECT FILES"
            echo "============================================================"

            echo "--- sdkconfig.defaults ---"
            if [ -f sdkconfig.defaults ]; then
              cat sdkconfig.defaults
            else
              echo "NO sdkconfig.defaults"
            fi

            echo "--- existing sdkconfig PSK settings ---"
            grep -n -i "PSK" sdkconfig || true

            echo "============================================================"
            echo "ESP-IDF VERSION"
            echo "============================================================"

            idf.py --version

            echo "============================================================"
            echo "KCONFIG SOURCE"
            echo "============================================================"

            echo "--- CONFIG_MBEDTLS_PSK_MODES definitions ---"
            grep -R -n \
              "config MBEDTLS_PSK_MODES" \
              "$IDF_PATH/components" \
              2>/dev/null \
              | head -20 \
              || true

            echo "--- CONFIG_MBEDTLS_KEY_EXCHANGE_PSK definitions ---"
            grep -R -n \
              "config MBEDTLS_KEY_EXCHANGE_PSK" \
              "$IDF_PATH/components" \
              2>/dev/null \
              | head -20 \
              || true

            echo "============================================================"
            echo "KCONFIG CONTEXT"
            echo "============================================================"

            echo "--- mbedTLS Kconfig PSK context ---"
            grep -R -n -B15 -A25 \
              "MBEDTLS_PSK_MODES" \
              "$IDF_PATH/components/mbedtls" \
              2>/dev/null \
              | head -150 \
              || true

            echo "--- key exchange PSK context ---"
            grep -R -n -B15 -A25 \
              "KEY_EXCHANGE_PSK" \
              "$IDF_PATH/components/mbedtls" \
              2>/dev/null \
              | head -150 \
              || true

            echo "============================================================"
            echo "GENERATE CONFIGURATION"
            echo "============================================================"

            idf.py set-target esp32p4
            idf.py reconfigure

            echo "============================================================"
            echo "RESULTING SDKCONFIG"
            echo "============================================================"

            echo "--- PSK ---"
            grep -n -i "PSK" sdkconfig || true

            echo "--- KEY EXCHANGE ---"
            grep -n -i "KEY_EXCHANGE" sdkconfig || true

            echo "--- all MBEDTLS ---"
            grep -n "CONFIG_MBEDTLS" sdkconfig || true

            echo "============================================================"
            echo "GENERATED SDKCONFIG.H"
            echo "============================================================"

            grep -n -i "PSK" \
              build/config/sdkconfig.h \
              || true

            echo "============================================================"
            echo "GENERATED MBEDTLS CONFIG"
            echo "============================================================"

            grep -R -n \
              "MBEDTLS_KEY_EXCHANGE.*PSK" \
              build \
              2>/dev/null \
              | head -100 \
              || true

            echo "============================================================"
            echo "ESP-IDF MBEDTLS CONFIG HEADER"
            echo "============================================================"

            grep -R -n -B5 -A10 \
              "MBEDTLS_KEY_EXCHANGE_PSK_ENABLED" \
              "$IDF_PATH/components/mbedtls" \
              2>/dev/null \
              | head -100 \
              || true

            echo "============================================================"
            echo "ARDUINO SSL CONDITION"
            echo "============================================================"

            sed -n '24,35p' \
              components/arduino-esp32/libraries/NetworkClientSecure/src/ssl_client.cpp

            echo "============================================================"
            echo "END"
            echo "============================================================"