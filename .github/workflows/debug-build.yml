name: Debug ESP32-P4 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Debug ESP32-P4 build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32p4
          command: |
            idf.py set-target esp32p4
            idf.py reconfigure
            echo "=== ARDUINO SSL SOURCES ==="
            grep -n -A5 -B2 "ARDUINO_LIBRARY_NetworkClientSecure_SRCS" components/arduino-esp32/CMakeLists.txt
            echo "=== GENERATED SOURCES ==="
            grep -R "ssl_client.cpp" build/esp-idf/arduino-esp32 2>/dev/null | head -20
            echo "=== ARCHIVE ==="
            ar t build/esp-idf/arduino-esp32/libarduino-esp32.a 2>/dev/null | grep -E "ssl_client|NetworkClientSecure"

