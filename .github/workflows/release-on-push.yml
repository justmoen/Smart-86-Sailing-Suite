name: Release on tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-on-tag
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build ESP32-P4 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32p4
          command: |
            set -e

            echo "============================================================"
            echo "ESP-IDF"
            echo "============================================================"
            idf.py --version

            echo ""
            echo "============================================================"
            echo "CLEAN BUILD CONFIGURATION"
            echo "============================================================"

            rm -rf build sdkconfig sdkconfig.old

            echo ""
            echo "Setting ESP32-P4 target..."
            idf.py set-target esp32p4

            echo ""
            echo "============================================================"
            echo "CONFIGURATION"
            echo "============================================================"

            echo "ESP-IDF target:"
            grep -n "^CONFIG_IDF_TARGET=" sdkconfig || true

            echo ""
            echo "ESP32-P4 revision:"
            grep -n "^CONFIG_ESP32P4_" sdkconfig || true
            grep -n "^CONFIG_ESP_REV_" sdkconfig || true

            echo ""
            echo "PSRAM:"
            grep -n "^CONFIG_SPIRAM" sdkconfig || true

            echo ""
            echo "ESP-Hosted:"
            grep -n "CONFIG_ESP_HOSTED" sdkconfig || true
            grep -n "CONFIG_ESP_WIFI_REMOTE" sdkconfig || true

            echo ""
            echo "mbedTLS PSK:"
            grep -n "CONFIG_MBEDTLS_PSK" sdkconfig || true
            grep -n "CONFIG_MBEDTLS_KEY_EXCHANGE" sdkconfig || true

            echo ""
            echo "Flash:"
            grep -n "^CONFIG_ESPTOOLPY_FLASH" sdkconfig || true

            echo ""
            echo "============================================================"
            echo "MANAGED COMPONENTS"
            echo "============================================================"

            if [ -f managed_components/espressif__esp_hosted/idf_component.yml ]; then
              echo "ESP-Hosted:"
              grep -n "^version:" \
                managed_components/espressif__esp_hosted/idf_component.yml || true
            fi

            if [ -f managed_components/espressif__esp_wifi_remote/idf_component.yml ]; then
              echo "ESP-WiFi-Remote:"
              grep -n "^version:" \
                managed_components/espressif__esp_wifi_remote/idf_component.yml || true
            fi

            if [ -f managed_components/espressif__arduino-esp32/idf_component.yml ]; then
              echo "Arduino:"
              grep -n "^version:" \
                managed_components/espressif__arduino-esp32/idf_component.yml || true
            fi

            echo ""
            echo "============================================================"
            echo "RECONFIGURE"
            echo "============================================================"

            idf.py reconfigure

            echo ""
            echo "============================================================"
            echo "FINAL CONFIGURATION"
            echo "============================================================"

            echo "ESP-IDF target:"
            grep -n "^CONFIG_IDF_TARGET=" sdkconfig || true

            echo ""
            echo "ESP32-P4 revision:"
            grep -n "^CONFIG_ESP32P4_" sdkconfig || true
            grep -n "^CONFIG_ESP_REV_" sdkconfig || true

            echo ""
            echo "PSRAM:"
            grep -n "^CONFIG_SPIRAM" sdkconfig || true

            echo ""
            echo "ESP-Hosted:"
            grep -n "CONFIG_ESP_HOSTED" sdkconfig || true
            grep -n "CONFIG_ESP_WIFI_REMOTE" sdkconfig || true

            echo ""
            echo "mbedTLS:"
            grep -n "CONFIG_MBEDTLS_PSK" sdkconfig || true
            grep -n "CONFIG_MBEDTLS_KEY_EXCHANGE" sdkconfig || true

            echo ""
            echo "============================================================"
            echo "BUILD"
            echo "============================================================"

            idf.py build

            echo ""
            echo "============================================================"
            echo "BUILD COMPLETE"
            echo "============================================================"

            ls -lh build/sailing_suite.bin

            sha256sum build/sailing_suite.bin

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            build/sailing_suite.bin