name: Release on tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-on-tag
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      IDF_TARGET: esp32p4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3

      - name: Print target info
        shell: bash
        run: |
          echo "IDF_TARGET=${IDF_TARGET:-unset}"
          env | grep IDF || true

      - name: Build ESP32-P4 firmware
        shell: bash
        env:
          IDF_TARGET: esp32p4
        run: |
          . "$IDF_PATH/export.sh"
          unset IDF_TARGET
          export IDF_TARGET=esp32p4
          echo "Final IDF_TARGET=$IDF_TARGET"
          rm -f sdkconfig
          idf.py set-target esp32p4
          idf.py build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            build/sailing_suite.bin
